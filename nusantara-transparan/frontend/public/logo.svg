<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="nt-shield-grad" x1="12" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4FF24" />
      <stop offset="55%" stop-color="#1558C9" />
      <stop offset="100%" stop-color="#0B2D6E" />
    </linearGradient>
    <linearGradient id="nt-core-grad" x1="20" y1="16" x2="100" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1528" />
      <stop offset="100%" stop-color="#030407" />
    </linearGradient>
    <linearGradient id="nt-bar-lime" x1="0" y1="30" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4FF24" />
      <stop offset="100%" stop-color="#88B800" />
    </linearGradient>
    <linearGradient id="nt-bar-blue" x1="0" y1="40" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1558C9" />
    </linearGradient>
    <filter id="nt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Blockchain Shield -->
  <path
    d="M60 6L106 31V79C106 96.5 86.2 109.4 60 115C33.8 109.4 14 96.5 14 79V31L60 6Z"
    fill="url(#nt-core-grad)"
    stroke="url(#nt-shield-grad)"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Inner Subtle Cyber Grid Ring -->
  <path
    d="M60 15L97 35.5V75.5C97 89.2 81 100 60 105C39 100 23 89.2 23 75.5V35.5L60 15Z"
    stroke="#1558C9"
    stroke-opacity="0.35"
    stroke-width="1.5"
    stroke-dasharray="4 3"
  />

  <!-- Financial Transparency & Monogram 'N' Bars -->
  <!-- Left Pillar (Blue) -->
  <rect x="34" y="46" width="11" height="38" rx="5.5" fill="url(#nt-bar-blue)" />

  <!-- Diagonal Blockchain Link (Connecting Left Pillar to Right Pillar forming 'N') -->
  <path
    d="M39.5 51L80.5 78"
    stroke="url(#nt-shield-grad)"
    stroke-width="8"
    stroke-linecap="round"
  />

  <!-- Center Analytical Pillar (Translucent Blue) -->
  <rect x="54.5" y="56" width="11" height="28" rx="5.5" fill="#1558C9" fill-opacity="0.7" />

  <!-- Right Rising Pillar (Cyber Lime) -->
  <rect x="75" y="34" width="11" height="50" rx="5.5" fill="url(#nt-bar-lime)" filter="url(#nt-glow)" />

  <!-- Cryptographic Verification Nodes -->
  <circle cx="39.5" cy="46" r="4" fill="#D4FF24" />
  <circle cx="80.5" cy="34" r="4.5" fill="#FFFFFF" stroke="#D4FF24" stroke-width="2" />
  <circle cx="60" cy="24" r="3.5" fill="#D4FF24" filter="url(#nt-glow)" />

  <!-- Top Node Connection Lines -->
  <path d="M39.5 46L60 24L80.5 34" stroke="#D4FF24" stroke-opacity="0.55" stroke-width="1.75" stroke-dasharray="2.5 2.5" />
</svg>
