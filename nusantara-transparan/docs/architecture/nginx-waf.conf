# =============================================================================
# NUSANTARA TRANSPARAN — NGINX REVERSE PROXY, TLS 1.3, & WAF FILTERING
# Menyaring traffic eksternal & meneruskan request bersih ke Backend Go (:8080)
# =============================================================================

# 1. Zona Rate Limiting & Batas Koneksi Serentak (Anti-DDoS Lapis Reverse Proxy)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    server_name transparan.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name transparan.go.id;

    # Sembunyikan versi Nginx agar tidak bisa di-reconnaissance oleh peretas
    server_tokens off;

    # 2. Enkripsi TLS 1.3 Ketat (Checklist Keamanan #6)
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 3. Batas Koneksi & Ukuran Payload (Anti-Slowloris & Buffer Overflow)
    limit_conn conn_per_ip 20;
    client_max_body_size 1M;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 4. Blokir User-Agent Exploit Scanners di Lapis Nginx
    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|acunetix|dirbuster|gobuster|nuclei)) {
        return 403;
    }

    # 5. Blokir Akses ke File Tersembunyi (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 6. Endpoint Login dengan Rate Limit Ekstra Ketat (1 req/detik)
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 7. Endpoint REST API Utama -> Diteruskan ke Backend Go di 127.0.0.1:8080
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
